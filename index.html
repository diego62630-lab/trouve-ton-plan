<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#164e3b">
<title>Trouve ton plan</title>
<link rel="manifest" href="./manifest.json">
<style>
* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f7f2;
  color:#183b2d;
}

header {
  background:#164e3b;
  color:white;
  padding:30px 20px;
  border-radius:0 0 25px 25px;
}

header h1 { margin:0; font-size:27px; }
header p { color:#d7eadc; }

main {
  max-width:550px;
  margin:auto;
  padding:20px;
}

h2 { font-size:19px; margin-top:25px; }

input, select {
  width:100%;
  padding:14px;
  border:1px solid #d5ded5;
  border-radius:12px;
  background:white;
  font-size:16px;
}

.choices {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.choice {
  padding:16px 8px;
  background:white;
  border:2px solid transparent;
  border-radius:14px;
  font-size:15px;
}

.choice.selected {
  border-color:#23834d;
  background:#e4f4e8;
}

#budget {
  font-size:25px;
  font-weight:bold;
}

input[type=range] {
  accent-color:#23834d;
  padding:0;
}

.find {
  width:100%;
  padding:17px;
  margin-top:25px;
  background:#23834d;
  color:white;
  border:0;
  border-radius:14px;
  font-size:17px;
  font-weight:bold;
}

.result {
  background:white;
  border-radius:15px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 2px 8px #0000000c;
}

.result h3 { margin-top:0; }

.price {
  color:#23834d;
  font-weight:bold;
}

.favorite {
  background:#e4f4e8;
  border:0;
  padding:10px;
  border-radius:9px;
  margin-top:10px;
}

footer {
  text-align:center;
  padding:25px;
  color:#718174;
  font-size:13px;
}
</style>
</head>

<body>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("Application prête !"))
      .catch(error => console.log(error));
  });
}
</script>
<header>
  <h1>🌿 TROUVE TON PLAN</h1>
  <p>Des idées pour profiter sans se ruiner !</p>
</header>

<main>

  <h2>📍 Dans quelle ville ?</h2>
  <input id="city" type="text"
  placeholder="Exemple : Boulogne-sur-Mer">

  <h2>📅 Quel jour ?</h2>
  <select id="day">
    <option>Aujourd'hui</option>
    <option>Demain</option>
    <option>Samedi</option>
    <option>Dimanche</option>
    <option>Pendant les vacances</option>
  </select>

  <h2>👨‍👩‍👧 Avec qui ?</h2>
  <div class="choices" id="profiles">
    <button class="choice selected" data-value="Famille">👨‍👩‍👦 Famille</button>
    <button class="choice" data-value="Couple">❤️ Couple</button>
    <button class="choice" data-value="Solo">👤 Solo</button>
    <button class="choice" data-value="Amis">👫 Amis</button>
  </div>

  <h2>💰 Ton budget maximum</h2>
  <div id="budget">30 €</div>
  <input type="range" id="money"
  min="0" max="200" step="5" value="30">

  <h2>🎯 Que veux-tu faire ?</h2>
  <div class="choices" id="activities">
    <button class="choice selected" data-value="Sortir">🌳 Sortir</button>
    <button class="choice" data-value="Manger">🍽️ Manger</button>
    <button class="choice" data-value="Amuser">🎮 S'amuser</button>
    <button class="choice" data-value="Maison">🏠 À la maison</button>
  </div>

  <button class="find" onclick="findPlan()">
    TROUVER MON PLAN ✨
  </button>

  <div id="results"></div>

  <h2>❤️ Mes favoris</h2>
  <div id="favorites">
    <p>Tu n'as pas encore de favoris.</p>
  </div>

</main>

<footer>
  TROUVE TON PLAN © 2026<br>
  Profite de la vie, maîtrise ton budget !
</footer>

<script>

document.querySelectorAll(".choices").forEach(group => {
  group.querySelectorAll(".choice").forEach(button => {
    button.addEventListener("click", () => {
      group.querySelectorAll(".choice").forEach(b =>
        b.classList.remove("selected"));
      button.classList.add("selected");
    });
  });
});

const money = document.getElementById("money");

money.addEventListener("input", () => {
  document.getElementById("budget").textContent =
  money.value + " €";
});

const ideas = {
  Sortir: [
    ["Balade dans un parc","Une promenade en pleine nature.",0],
    ["Pique-nique","Prépare un pique-nique ensemble.",10],
    ["Sortie à la plage","Profite du grand air.",0],
    ["Visite culturelle","Découvre le patrimoine local.",15],
    ["Randonnée","Pars explorer les alentours.",0],
    ["Sortie vélo","Une balade sportive.",0]
  ],

  Manger: [
    ["Goûter gourmand","Un moment gourmand à partager.",8],
    ["Restaurant","Un repas à l'extérieur.",30],
    ["Repas fait maison","Prépare un bon repas.",15],
    ["Pâtisserie maison","Prépare de délicieux desserts.",8]
  ],

  Amuser: [
    ["Jeux de société","Organise un tournoi.",0],
    ["Bowling","Défie tes proches.",25],
    ["Soirée cinéma","Une séance de cinéma.",15],
    ["Jeux vidéo","Organise un tournoi.",0],
    ["Escape game","Résous des énigmes ensemble.",30]
  ],

  Maison: [
    ["Soirée cinéma","Film et pop-corn.",5],
    ["Atelier cuisine","Prépare une recette.",10],
    ["Défi jeux vidéo","Organise un tournoi.",0],
    ["Soirée jeux","Amuse-toi avec tes proches.",0],
    ["Atelier créatif","Laisse parler ton imagination.",5]
  ]
};

function getFavorites() {
  try {
    return JSON.parse(localStorage.getItem("plansFavoris")) || [];
  } catch(e) {
    return [];
  }
}

function saveFavorite(name, price) {
  let favorites = getFavorites();

  if (!favorites.some(f => f.name === name)) {
    favorites.push({name:name, price:price});
    localStorage.setItem("plansFavoris",JSON.stringify(favorites));
  }

  showFavorites();
}

function showFavorites() {
  const box = document.getElementById("favorites");
  const favorites = getFavorites();

  if (favorites.length === 0) {
    box.innerHTML = "<p>Tu n'as pas encore de favoris.</p>";
    return;
  }

  box.innerHTML = favorites.map(f =>
    `<div class="result">
      <strong>${f.name}</strong>
      <p>${f.price} € estimés</p>
    </div>`
  ).join("");
}

function findPlan() {
  const city = document.getElementById("city").value.trim();
  const day = document.getElementById("day").value;
  const profile = document.querySelector("#profiles .selected").dataset.value;
  const activity = document.querySelector("#activities .selected").dataset.value;
  const budget = Number(money.value);

  const results = document.getElementById("results");
  const matching = ideas[activity].filter(idea => idea[2] <= budget);

  results.innerHTML = `<h2>✨ Tes idées ${city ? "pour " + city : ""}</h2>
  <p>${day} · ${profile} · Budget : ${budget} €</p>`;

  if (matching.length === 0) {
    results.innerHTML += "<p>Aucune idée trouvée. Essaie un autre budget.</p>";
    return;
  }

  matching.forEach(idea => {
    const card = document.createElement("div");
    card.className = "result";

    const title = document.createElement("h3");
    title.textContent = idea[0];

    const description = document.createElement("p");
    description.textContent = idea[1];

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = "Budget estimé : " + idea[2] + " €";

    const favorite = document.createElement("button");
    favorite.className = "favorite";
    favorite.textContent = "❤️ Ajouter aux favoris";
    favorite.onclick = () => saveFavorite(idea[0],idea[2]);

    card.append(title,description,price,favorite);
    results.appendChild(card);
  });
}

showFavorites();

</script>

</body>
</html>
